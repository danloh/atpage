
[package]
name = "atpage"
version = "0.1.0"
edition = "2024"

[profile.release]
codegen-units = 1
opt-level = "z"
panic = "abort"
lto = true
strip = true 

#[dev-dependencies]
#console_error_panic_hook = { workspace = true }

[dependencies]
leptos = { version = "0.8.15", features = ["csr"] }
leptos_meta = "0.8.5"
leptos_router = "0.8.11"
leptos-use = "0.18.0"
phosphor-leptos = "0.8.0"

itertools = "0.14.0"
chrono = "0.4.43"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
futures = "0.3.31"
reqwest = { version = "0.13.1", features = ["json"] }
codee = { version = "0.3.5", features = ["prost", "json_serde"] }

slug = "0.1.6"
latex2mathml = "0.2.3"

web-sys = { version = "0.3.83", features = ["Document", "HtmlElement"] } 

[dependencies.pulldown-cmark]
version = "0.13.0"
default-features = false 
features = ["simd", "html"]

[dependencies.gloo]
version = "0.11.0"
features = ["futures"]
